services:

  ### 키키하이 도커 이미지
  spring:
    image: kikihistore/server:latest
    container_name: kkh-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - mongodb
      - elasticsearch
    networks:
      - backend-bridge

  # Nginx Proxy
  nginx:  # nginx 서비스 정의
    image: nginx:latest  # 사용할 Docker 이미지
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /letsencrypt/certbot/conf:/etc/letsencrypt
      - /letsencrypt/certbot/www:/var/www/certbot
    ports:
      - 80:80
      - 443:443
    depends_on:
      - spring
    networks:
      - backend-bridge
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  certbot:
    container_name: certbot
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - /letsencrypt/certbot/conf:/etc/letsencrypt
      - /letsencrypt/certbot/www:/var/www/certbot
    depends_on:
      - nginx
    networks:
      - backend-bridge
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # MySQL
  mysql:
    image: mysql:8.0
    container_name: kkh-mysql
    ports:
      - '3306:3306'
    volumes:
      - ./mysql/data:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      - backend-bridge

  # Redis
  redis:
    image: redis:7.2.5
    container_name: kkh-redis
    ports:
      - '6379:6379'
    networks:
      - backend-bridge

  # MongoDB
  mongodb:
    image: mongo:6.0.16
    container_name: kkh-mongodb
    ports:
      - '27017:27017'
    volumes:
      - ./mongodb/data:/data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE}
    networks:
      - backend-bridge
  ## 배포할 때 -> 비밀번호, github action에 설정, nori 설치(bin/elasticsearch-plugin install analysis-nori)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: kkh-elasticsearch
    build:
      context: ./elasticsearch
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9200:9200" # 엘라스틱서치 CRUD용 API 포트
      - "9300:9300" # 엘라스틱서치 클러스터 통신용 포트
    environment:
      - discovery.type=single-node # 단일 노드 모드
      - xpack.security.enabled=false # 가상머신의 메모리 설정
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=kikihi
    volumes:
      - ./elasticSearch/elastic_dict:/usr/share/elasticsearch/config/dict
    networks:
      - backend-bridge

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.0
    container_name: kkh-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - backend-bridge

  logstash:
    build:
        context: ./logstash
        dockerfile: Dockerfile
    container_name: kkh-logstash
    environment:
      - LS_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "5044:5044"      # Beats input 등 사용시
      - "9600:9600"      # Logstash monitoring API
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml
      # 필요시 동의어 사전 등 추가 볼륨
      - ./elasticSearch/elastic_dict:/usr/share/elasticsearch/config/dict
    depends_on:
      - elasticsearch
    networks:
      - backend-bridge
networks:
  backend-bridge:
    driver: bridge
